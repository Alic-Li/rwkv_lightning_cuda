# The address exposed by the router. Use 0.0.0.0 to accept LAN traffic.
listen = "0.0.0.0:8080"

# 0 means no router-enforced body limit. The backend still validates its own limits.
max_request_body_bytes = 537919488

# Non-streaming and SSE requests are both kept open until the upstream finishes.
# 0 disables the total request timeout (recommended when clients use long generations).
request_timeout_seconds = 0

# After an upstream connection/transport failure, temporarily avoid that endpoint.
failure_cooldown_seconds = 5

# Retry only failed State uploads; keep the same UUID/body for every attempt.
# 1 disables retries. Defaults apply when omitted or 0.
state_upload_max_attempts = 3
state_upload_attempt_timeout_seconds = 120
state_upload_retry_base_ms = 250
state_upload_retry_max_ms = 2000

[[backends]]
name = "gpu-a"
url = "http://192.168.1.21:8000"
# Relative throughput/capacity. A value of 2 receives roughly twice the active bsz.
weight = 1

[[backends]]
name = "gpu-b"
url = "http://192.168.1.22:8000"
weight = 1
