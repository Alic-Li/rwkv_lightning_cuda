name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test release recovery
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Read and validate VERSION
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a semantic version such as 1.5.0" >&2
            exit 1
          fi

          tag="v$version"
          should_release=false
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main)
              # A missing release or an interrupted draft should be completed.
              # A published release means this VERSION has already shipped.
              should_release="$(RELEASE_TAG="$tag" python3 tools/ci/publish_release.py --check)"
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Package version: $tag; create/update release: $should_release"

  build:
    name: CUDA ${{ matrix.cuda }} / ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        cuda: ['12.9.0', '13.2.2']
        include:
          # CUDA 13 on Windows split the front end out of nvcc.
          - os: windows-2022
            cuda: '13.2.2'
            cuda-split-packages: ',"crt","nvvm"'
    env:
      CUDA_VERSION: ${{ matrix.cuda }}
      RWKV_RELEASE_VERSION: ${{ needs.version.outputs.tag }}
      # PRs compile one architecture; release/manual builds cover the full set.
      CUDA_ARCHITECTURES: ${{ github.event_name == 'pull_request' && '86' || '75;80;86;87;89;90;100;120' }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      # CMake reads these at configure time. sccache stores each object in the
      # Actions cache as it compiles, so even a cancelled run leaves hits behind.
      SCCACHE_GHA_ENABLED: 'true'
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: sccache
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: RWKV_Lightning_CUDA_router/go.mod
          cache-dependency-path: RWKV_Lightning_CUDA_router/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('RWKV_Lightning_CUDA_Launcher/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Build and test launcher frontend
        working-directory: RWKV_Lightning_CUDA_Launcher
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Test Go components
        shell: bash
        run: |
          (cd RWKV_Lightning_CUDA_router && go test ./... && go vet ./...)
          # `.`, not `./...`: bun install has already populated node_modules,
          # and ./... walks into the Go package that ships inside the `flatted`
          # npm dependency. Compiling a JS dependency's Go sources is not
          # something this build should be able to fail on.
          (cd RWKV_Lightning_CUDA_Launcher && go test . && go vet .)
          # The launcher's NVML metrics file is guarded by "linux && cgo";
          # compile it once with CGO enabled so build errors surface in CI
          # instead of at release time (no CUDA toolkit needed, only gcc).
          if [ "$(go env GOOS)" = "linux" ]; then
            (cd RWKV_Lightning_CUDA_Launcher && CGO_ENABLED=1 go build .)
          fi
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config zip unzip autoconf automake libtool
      # Install only what the build uses instead of the full toolkit: the full
      # Windows installer alone took ~10 minutes. curand_dev is for the
      # curand_kernel.h device header, thrust/cccl for <cuda/pipeline> and the
      # profiler API for tools/calibration.
      # On Linux apt tracks the newest patch of the requested major.minor.
      # The slim Windows install still takes ~5 minutes, so keep the installed
      # tree. Nothing else the build needs lives outside it (Ninja does not use
      # the Visual Studio integration). Bump the key suffix when changing the
      # sub-packages below.
      - name: Cache CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-windows-${{ matrix.cuda }}-pkgs2
      - name: Use cached CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $dir = (Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' -Directory | Select-Object -First 1).FullName
          "CUDA_PATH=$dir" >> $env:GITHUB_ENV
          "$dir\bin" >> $env:GITHUB_PATH
          & "$dir\bin\nvcc.exe" --version
      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows' && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc","cudart","cublas","cublas_dev","curand_dev","cuda_profiler_api","thrust","visual_studio_integration"${{ matrix.cuda-split-packages }}]'
          use-github-cache: false
          log-file-suffix: ${{ matrix.os }}-${{ matrix.cuda }}.txt
      - name: Install CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc","cudart-dev","cccl","profiler-api"]'
          non-cuda-sub-packages: '["libcublas-dev","libcurand-dev"]'
          log-file-suffix: ${{ matrix.os }}-${{ matrix.cuda }}.txt
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0 # 2025.06.13
          path: third_party/vcpkg
          persist-credentials: false
      # vcpkg's package ABI includes the compiler version, which changes as the
      # runner image rolls. Restore by prefix and save under a hash of the cache
      # contents, so newly built packages get stored instead of being rebuilt
      # on every run once the old key goes stale.
      - name: Restore C++ dependencies
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          # Never saved: always falls through to the newest content-keyed entry.
          key: vcpkg-${{ matrix.os }}-2025.06.13-${{ hashFiles('tools/ci/vcpkg.json') }}-latest
          restore-keys: |
            vcpkg-${{ matrix.os }}-2025.06.13-${{ hashFiles('tools/ci/vcpkg.json') }}-
            vcpkg-${{ matrix.os }}-2025.06.13-${{ hashFiles('tools/ci/vcpkg.json') }}
      - name: Build, test and package
        run: python tools/ci/build_release.py
      - name: Save C++ dependencies
        if: >-
          success() && hashFiles('.vcpkg-cache/**') != '' &&
          steps.vcpkg-cache.outputs.cache-matched-key != format('vcpkg-{0}-2025.06.13-{1}-{2}',
            matrix.os, hashFiles('tools/ci/vcpkg.json'), hashFiles('.vcpkg-cache/**'))
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-2025.06.13-${{ hashFiles('tools/ci/vcpkg.json') }}-${{ hashFiles('.vcpkg-cache/**') }}
      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.cuda }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cuda }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: needs.version.outputs.should_release == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          cd dist
          # Accept checksum artifacts produced by older Windows builds, whose
          # Python text output used CRLF and confused GNU sha256sum.
          sed -i 's/\r$//' -- *.sha256
          sha256sum --check *.sha256

          cd ..
          python3 tools/ci/publish_release.py
