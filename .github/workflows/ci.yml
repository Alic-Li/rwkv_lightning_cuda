name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read and validate VERSION
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must contain a semantic version such as 1.5.0" >&2
            exit 1
          fi

          tag="v$version"
          should_release=false
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main|workflow_dispatch:refs/heads/main)
              # A missing release or an interrupted draft should be completed.
              # A published release means this VERSION has already shipped.
              if gh release view "$tag" --json isDraft > release.json 2>/dev/null; then
                if [[ "$(jq -r '.isDraft' release.json)" == "true" ]]; then
                  should_release=true
                fi
              else
                should_release=true
              fi
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "Package version: $tag; create/update release: $should_release"

  build:
    name: CUDA ${{ matrix.cuda }} / ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        cuda: ['12.9.0', '13.2.2']
    env:
      CUDA_VERSION: ${{ matrix.cuda }}
      RWKV_RELEASE_VERSION: ${{ needs.version.outputs.tag }}
      # PRs compile one architecture; release/manual builds cover the full set.
      CUDA_ARCHITECTURES: ${{ github.event_name == 'pull_request' && '86' || '75;80;86;87;89;90;100;120' }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: RWKV_Lightning_CUDA_router/go.mod
          cache-dependency-path: RWKV_Lightning_CUDA_router/go.sum
      - name: Test Go components
        shell: bash
        run: |
          (cd RWKV_Lightning_CUDA_router && go test ./... && go vet ./...)
          go vet RWKV_Lightning_CUDA_Launcher/main.go
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config zip unzip autoconf automake libtool
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: local
          linux-local-args: '["--toolkit"]'
          use-github-cache: false
          log-file-suffix: ${{ matrix.os }}-${{ matrix.cuda }}.txt
      - name: Check out pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0 # 2025.06.13
          path: third_party/vcpkg
          persist-credentials: false
      - name: Cache C++ dependencies
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.os }}-2025.06.13-${{ hashFiles('tools/ci/vcpkg.json') }}
      - name: Build, test and package
        run: python tools/ci/build_release.py
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}-${{ matrix.cuda }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.cuda }}
          path: build/Testing/Temporary/
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    if: needs.version.outputs.should_release == 'true'
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          cd dist
          # Accept checksum artifacts produced by older Windows builds, whose
          # Python text output used CRLF and confused GNU sha256sum.
          sed -i 's/\r$//' -- *.sha256
          sha256sum --check *.sha256

          if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" > /dev/null
          fi

          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' release.json)" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace it" >&2
              exit 1
            fi
            echo "Resuming existing draft release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz ./*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
